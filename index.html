<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal Project Management & Productivity Dashboard with Supabase, Gantt Charts, Sticky Notes, and Automated Notifications">
  <title>Personal Project Management & Productivity Dashboard</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Application CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/projects.css">
  <link rel="stylesheet" href="css/todos.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/gantt.css">
  <link rel="stylesheet" href="css/history.css">
  <link rel="stylesheet" href="css/midnight-theme.css">

  <!-- Supabase Official JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
</head>
<body>

  <!-- =========================================================================
       1. Authentication View (Displayed when session is unauthenticated)
       ========================================================================= -->
  <div id="auth-view" style="display: none;">
    <!-- Rendered dynamically by js/app.js -->
  </div>

  <!-- =========================================================================
       2. Protected Application Shell (Sidebar + Top Navigation + Main Canvas)
       ========================================================================= -->
  <div id="app-shell" style="display: none;">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="#" class="logo-brand" data-view="dashboard">
          <span class="logo-icon">⚡</span>
          <h1>PRIMNGMT</h1>
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Productivity Workspace</div>
        <ul class="nav-list">
          <li>
            <a href="#dashboard" class="nav-link active" data-view="dashboard">
              <span class="nav-icon">📊</span>
              <span>Dashboard</span>
            </a>
          </li>
          <li>
            <a href="#projects" class="nav-link" data-view="projects">
              <span class="nav-icon">📁</span>
              <span>Projects & Tasks</span>
            </a>
          </li>
          <li>
            <a href="#todos" class="nav-link" data-view="todos">
              <span class="nav-icon">📌</span>
              <span>To-Do Sticky Notes</span>
            </a>
          </li>
          <li>
            <a href="#calendar" class="nav-link" data-view="calendar">
              <span class="nav-icon">📅</span>
              <span>Monthly Calendar</span>
            </a>
          </li>
          <li>
            <a href="#gantt" class="nav-link" data-view="gantt">
              <span class="nav-icon">📈</span>
              <span>Project Gantt Charts</span>
            </a>
          </li>
          <li>
            <a href="#history" class="nav-link" data-view="history">
              <span class="nav-icon">🏆</span>
              <span>Completion History</span>
            </a>
          </li>
        </ul>
      </nav>

      <!-- Sidebar Footer / Authenticated User Account -->
      <div class="sidebar-footer">
        <div class="user-badge">
          <div class="user-avatar" id="user-avatar-initial">U</div>
          <div class="user-meta">
            <span class="user-email-text" id="user-email-display">Personal User</span>
            <span class="user-role-text">Single-User Personal Mode</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Workspace Area -->
    <div class="main-wrapper">
      <!-- Top Navigation Header -->
      <header class="top-header">
        <div class="header-left">
          <button class="btn-mobile-menu" id="mobile-menu-btn" aria-label="Toggle Menu">
            ☰
          </button>
          <span class="app-tagline">Personal Project Management & Productivity</span>
        </div>

        <div class="header-right">
          <!-- Live IST Timezone Clock -->
          <div class="live-clock-badge" id="header-live-clock">
            --:--:-- IST
          </div>

          <!-- Quick Action "+ New Project" Button -->
          <button class="btn btn-primary btn-sm" id="btn-header-quick-add">
            <span class="icon">+</span> New Project
          </button>

          <!-- Logout Button -->
          <button class="btn btn-secondary btn-sm" id="btn-logout" title="Log Out">
            Sign Out
          </button>
        </div>
      </header>

      <!-- Dynamic View Container -->
      <main class="main-content-scroll" id="main-content-view">
        <!-- Rendered by js/app.js and view modules -->
      </main>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Main ES Module Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
